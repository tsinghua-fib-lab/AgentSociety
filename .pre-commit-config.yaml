# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^packages/agentsociety2/docs/
      - id: end-of-file-fixer
        exclude: ^packages/agentsociety2/docs/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(packages/agentsociety2|scripts/ci|examples/v2/daily_mobility)/
      - id: ruff-format
        files: ^packages/agentsociety2/

  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        language: node
        language_version: system
        entry: prettier --write
        additional_dependencies: [prettier@3.4.2]
        types_or: [ts, tsx, javascript, jsx, json, yaml, css, html]
        exclude: ^(frontend/node_modules/|extension/node_modules/|packages/agentsociety/|packages/agentsociety-community/|packages/agentsociety-benchmark/|packages/agentsociety/docs/|frontend/public/monaco-editor/)

      - id: check-release-metadata
        name: Check release metadata
        entry: python scripts/ci/release.py check
        language: python
        pass_filenames: false
        files: ^(CHANGELOG\.md|extension/package\.json|packages/agentsociety2/pyproject\.toml|scripts/ci/release\.py)$

      - id: check-repo-paths
        name: Check source paths and Git ignore rules
        entry: python scripts/ci/check_repo_paths.py
        language: python
        types: [text]
