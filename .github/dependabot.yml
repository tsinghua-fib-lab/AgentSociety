# Dependabot version updates — AgentSociety2 scope only.
#
# Legacy packages (agentsociety v1, community, benchmark) are intentionally
# excluded from version updates by omitting their directories below.
# Dependency-graph / security alerts for leftover uv.lock files are handled
# by patching those lockfiles (or dismissing out-of-scope alerts in GitHub
# Security); there is no supported dependabot.yml key to exclude graph paths.

version: 2

updates:
  - package-ecosystem: pip
    directory: /packages/agentsociety2
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - agentsociety2
      - dependencies

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - extension
      - dependencies
    ignore:
      # typescript-eslint does not support the TypeScript 7 compiler API yet.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - frontend
      - dependencies
    ignore:
      # Keep patch/minor updates while the lint toolchain remains on TS 6 APIs.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - ci
      - dependencies
