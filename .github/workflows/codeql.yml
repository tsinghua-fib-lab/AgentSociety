name: CodeQL

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/agentsociety2/agentsociety2/**"
      - "extension/src/**"
      - "frontend/src/**"
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/extension-ci.yml"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/agentsociety2-publish.yml"
      - "scripts/ci/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/agentsociety2/agentsociety2/**"
      - "extension/src/**"
      - "frontend/src/**"
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/extension-ci.yml"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/agentsociety2-publish.yml"
      - "scripts/ci/**"
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read shared CodeQL version
        id: bundle
        run: python3 scripts/ci/codeql.py --github-output "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml
          tools: ${{ steps.bundle.outputs.url }}
          threads: 2
          ram: 4096

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
