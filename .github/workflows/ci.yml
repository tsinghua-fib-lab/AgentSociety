name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "scripts/ci/**"
      - "Makefile"
      - "CHANGELOG.md"
      - "cliff.toml"
      - ".gitlab-ci.yml"
      - "packages/agentsociety2/agentsociety2/**"
      - "packages/agentsociety2/tests/**"
      - "packages/agentsociety2/examples/**"
      - "packages/agentsociety2/scripts/**"
      - "packages/agentsociety2/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "scripts/ci/**"
      - "Makefile"
      - "CHANGELOG.md"
      - "cliff.toml"
      - ".gitlab-ci.yml"
      - "packages/agentsociety2/agentsociety2/**"
      - "packages/agentsociety2/tests/**"
      - "packages/agentsociety2/examples/**"
      - "packages/agentsociety2/scripts/**"
      - "packages/agentsociety2/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/*.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MEM0_TELEMETRY: "False"
  ANONYMIZED_TELEMETRY: "False"
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-suffix: sdk-3.12

      - name: Install dependencies
        working-directory: packages/agentsociety2
        run: uv sync --frozen --package agentsociety2 --no-default-groups --extra dev

      - name: Check CI configuration parity
        run: make ci-config

      - name: Lint and type check
        run: make ci-python-lint

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-suffix: sdk-${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: packages/agentsociety2
        run: uv sync --frozen --package agentsociety2 --no-default-groups --extra dev

      - name: Run tests
        working-directory: packages/agentsociety2
        run: |
          make -C ../.. ci-python-test AS2_PYTEST_ARGS="-v --junitxml=junit.xml -o junit_family=xunit2 -o junit_suite_name=agentsociety2-py${{ matrix.python-version }}"
        env:
          AGENTSOCIETY_LLM_API_KEY: test-key
          AGENTSOCIETY_LLM_API_BASE: https://api.openai.com/v1
          AGENTSOCIETY_LLM_MODEL: gpt-5.5

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python-version }}
          path: packages/agentsociety2/junit.xml
          retention-days: 30

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-suffix: build-3.12

      - name: Build package
        run: make ci-package
