name: Frontend CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "scripts/ci/**"
      - "Makefile"
      - ".gitlab-ci.yml"
      - "frontend/**"
      - "!frontend/**/*.md"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "scripts/ci/**"
      - "Makefile"
      - ".gitlab-ci.yml"
      - "frontend/**"
      - "!frontend/**/*.md"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Install browser
        run: npx --no-install playwright install --with-deps --only-shell chromium

      - name: Lint, build and test production pages
        run: make -C .. ci-frontend

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Audit dependencies (advisory)
        # Use the official registry: npmmirror does not implement the audit API.
        # Advisory failures (transitive deps) must not block the build;
        # matches .gitlab-ci.yml lint-frontend / extension-ci.
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org || true
