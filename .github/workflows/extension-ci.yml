name: Extension CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "extension/**"
      - "!extension/docs/**"
      - "!extension/**/*.md"
      - ".github/workflows/extension-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "extension/**"
      - "!extension/docs/**"
      - "!extension/**/*.md"
      - ".github/workflows/extension-ci.yml"

concurrency:
  group: extension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: extension/.nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit
        # Use the official registry: npmmirror does not implement the audit API.
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org