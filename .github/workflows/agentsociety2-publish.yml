name: Publish AgentSociety 2

on:
  push:
    tags:
      - "agentsociety2-v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AS2_RELEASE_TAG: ${{ github.ref_name }}
  MEM0_TELEMETRY: "False"
  ANONYMIZED_TELEMETRY: "False"

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate tag, component versions and curated changelog
        run: make ci-release-check AS2_PYTHON=python

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-suffix: sdk-3.12

      - name: Lint and test Python package
        run: |
          uv sync --frozen --package agentsociety2 --no-default-groups --extra dev
          make ci-config ci-python-lint ci-python-test
        env:
          AGENTSOCIETY_LLM_API_KEY: test-key
          AGENTSOCIETY_LLM_API_BASE: https://api.openai.com/v1
          AGENTSOCIETY_LLM_MODEL: gpt-5.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: extension/.nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Lint and audit extension
        working-directory: extension
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          make -C .. ci-extension
          # Advisory failures (transitive deps) must not block the release;
          # follows the existing GitLab audit policy.
          npm audit --audit-level=high --registry=https://registry.npmjs.org || true

  documentation:
    name: Validate documentation and frontend
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-suffix: docs-3.12

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          uv sync --frozen --package agentsociety2 --no-default-groups --extra docs

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npx --no-install playwright install --with-deps --only-shell chromium

      - name: Check frontend and bilingual documentation
        run: make ci-frontend ci-docs-build ci-docs-browser

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-browser-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  build-python:
    name: Build Python distribution
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-suffix: build-3.12

      - name: Build package
        run: |
          cd packages/agentsociety2
          uv build --out-dir dist

      - name: Check distribution
        run: |
          cd packages/agentsociety2
          uv run --with twine twine check dist/*

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: packages/agentsociety2/dist/

  build-vscode:
    name: Build VSCode extension
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: extension/.nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: ./extension
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Validate webpack config
        working-directory: ./extension
        run: node -c webpack.config.js

      - name: Package extension
        working-directory: ./extension
        run: npm run package

      - name: Verify VSIX contents
        working-directory: ./extension
        run: |
          unzip -Z1 ai-social-scientist.vsix > vsix-contents.txt
          # extension host is webpack-bundled to dist/; webviews remain under out/webview/
          grep -q '^extension/dist/extension.js$' vsix-contents.txt
          grep -q '^extension/out/webview/configPage.js$' vsix-contents.txt
          grep -q '^extension/out/webview/helpPage.js$' vsix-contents.txt
          grep -q '^extension/out/webview/initConfig.js$' vsix-contents.txt
          grep -q '^extension/out/webview/prefillParams.js$' vsix-contents.txt
          grep -q '^extension/out/webview/replay.js$' vsix-contents.txt
          grep -q '^extension/out/webview/simSettings.js$' vsix-contents.txt
          grep -q '^extension/out/webview/skillMarketplace.js$' vsix-contents.txt
          # runtime deps are inlined into the host bundle; node_modules is not shipped
          ! grep -q '^extension/node_modules/' vsix-contents.txt

      - name: Store the VSIX package
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: extension/ai-social-scientist.vsix

  publish-to-pypi:
    name: Publish to PyPI
    permissions:
      contents: read
      id-token: write
    needs: [build-python, build-vscode, documentation]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentsociety2

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [publish-to-pypi, build-vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: python-dist/

      - name: Download VSCode extension
        uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: vscode-dist/

      - name: Extract validated version
        id: get_version
        run: |
          python3 scripts/ci/release.py check --release
          printf 'version=%s\n' "${AS2_RELEASE_TAG#agentsociety2-v}" >> "$GITHUB_OUTPUT"

      - name: Read curated release notes
        run: python3 scripts/ci/release.py notes --release --output release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: AgentSociety2 ${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          files: |
            python-dist/*.tar.gz
            python-dist/*.whl
            vscode-dist/*.vsix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
