name: "AgentSociety CodeQL config"

# Scan only AgentSociety2 active code (see .github/agentsociety2-scope.yml).
paths:
  - extension/src
  - frontend/src
  - packages/agentsociety2/agentsociety2
  - .github/workflows
  - scripts/ci

paths-ignore:
  - .github/workflows/agentsociety-publish.yml
  - .github/workflows/agentsociety-community-publish.yml
  - .github/workflows/agentsociety-benchmark-publish.yml
  - frontend/public/monaco-editor
  - packages/agentsociety
  - packages/agentsociety-community
  - packages/agentsociety-benchmark
  - packages/agentsociety/docs
  - "**/tests/**"
  - "**/node_modules/**"
  - "**/.venv/**"
