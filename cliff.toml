# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Usage:
#   git-cliff                           # generate changelog from all tags
#   git-cliff --latest                  # generate changelog for the latest tag only
#   git-cliff --unreleased              # generate changelog for unreleased changes
#   git-cliff --unreleased -o /tmp/as2-changelog-draft.md  # review a draft; keep curated history
#   git-cliff --tag agentsociety2-v2.4.0 --unreleased  # preview a specific version

[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="agentsociety2-v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}
        ## [{{ version | trim_start_matches(pat="agentsociety2-v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.breaking %} (**BREAKING**){% endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- Generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^Merge", skip = true },
    { message = '^fix\(security\)', group = "<!-- 5 -->Security" },
    { body = '(?im)^(Security:|CVE-[0-9]{4}-)', group = "<!-- 5 -->Security" },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 4 -->Fixed" },
    { message = "^(perf|refactor|docs?)", group = "<!-- 1 -->Changed" },
    { field = "breaking", pattern = "true", group = "<!-- 1 -->Changed" },
    { message = "^(style|test|chore|ci)", skip = true },
]
protect_breaking_commits = true
filter_commits = true
# Stable releases only; dots are literal and the complete tag must match.
tag_pattern = '^agentsociety2-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

sort_commits = "oldest"
