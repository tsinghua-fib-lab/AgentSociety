[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
constraint-dependencies = [
    "virtualenv==21.15.1",
    "filelock==4.2.4",
    "tornado==6.6",
]

[tool.uv.workspace]

members = ["packages/agentsociety2"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
agentsociety2 = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.11.13",
    "agentsociety2[docs]",
    "deptry>=0.25.1",
]
