stages:
  - lint
  - test
  - build
  - release

# New commits on the same branch cancel older pipelines' interruptible jobs
# (lint / test / speculative docker build). Publish jobs stay non-interruptible.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

variables:
  PYTHON_VERSION: "3.12"
  UV_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  MEM0_TELEMETRY: "False"
  ANONYMIZED_TELEMETRY: "False"
  DOCKER_BUILDKIT: "1"
  # Temporary image tag for speculative build → promote only after all gates pass.
  DOCKER_PIPELINE_IMAGE: "${CI_REGISTRY_IMAGE}:pipeline-${CI_PIPELINE_ID}"

# CI scope: AgentSociety2 + extension + frontend only.
# Legacy packages (agentsociety v1, community, benchmark) are excluded.

# ---------------------------------------------------------------------------
# Change sets
# ---------------------------------------------------------------------------
# python_changes: quality gates (lint/test). Includes .gitlab-ci.yml so CI edits
# are self-tested; that path alone does NOT rebuild the Docker image.
.python_changes: &python_changes
  - packages/agentsociety2/**/*
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

# Python bits of the image — speculative build waits for test 3.12.
# Image inputs overall (for humans; rules below are split to avoid double builds):
#   Dockerfile, .dockerignore, packages/agentsociety2/**, extension/**,
#   pyproject.toml, uv.lock, README.md, LICENSE
# frontend/ is intentionally absent — not installed into the runtime image.
.docker_python_changes: &docker_python_changes
  - packages/agentsociety2/**/*
  - pyproject.toml
  - uv.lock

# ---------------------------------------------------------------------------
# Caches (layered by churn rate)
# ---------------------------------------------------------------------------
# Lockfiles change rarely → high hit rate across MR pushes and main.
# Download caches only (not .venv / node_modules) so 3.11/3.12/3.13 share one
# UV cache safely and npm ci remains deterministic.
.uv_download_cache: &uv_download_cache
  key:
    files:
      - uv.lock
  paths:
    - .cache/uv
  policy: pull-push

.npm_extension_cache: &npm_extension_cache
  key:
    files:
      - extension/package-lock.json
  paths:
    - .cache/npm
  policy: pull-push

.npm_frontend_cache: &npm_frontend_cache
  key:
    files:
      - frontend/package-lock.json
  paths:
    - .cache/npm
  policy: pull-push

# ---------------------------------------------------------------------------
# Lint / test
# ---------------------------------------------------------------------------
lint:
  stage: lint
  image: python:3.12
  interruptible: true
  cache:
    <<: *uv_download_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *python_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *python_changes
  before_script:
    - pip install uv
    - cd packages/agentsociety2 && uv sync --extra dev
  script:
    - uv run ruff check .
    - uv run mypy tests/ --follow-imports=skip

lint-extension:
  stage: lint
  image: node:22
  interruptible: true
  cache:
    <<: *npm_extension_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - extension/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - extension/**/*
        - .gitlab-ci.yml
  before_script:
    - cd extension && npm ci
  script:
    - npm run lint
    - npm run build
    # npmmirror does not implement the audit API; query the official registry only for audit.
    # Advisory failures (transitive deps) must not block the build.
    - npm audit --audit-level=high --registry=https://registry.npmjs.org || true

lint-frontend:
  stage: lint
  image: node:22
  interruptible: true
  cache:
    <<: *npm_frontend_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
  before_script:
    - cd frontend && npm ci
  script:
    - npm run lint
    - npm run build
    # npmmirror does not implement the audit API; query the official registry only for audit.
    # Advisory failures (transitive deps) must not block the build.
    - npm audit --audit-level=high --registry=https://registry.npmjs.org || true

test:
  stage: test
  image: python:$PYTHON_VERSION
  interruptible: true
  needs: [lint]
  cache:
    <<: *uv_download_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *python_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *python_changes
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  before_script:
    - pip install uv
    - cd packages/agentsociety2 && uv sync --extra dev
  script:
    - |
      uv run pytest -v \
        -m "not network" \
        --junitxml=junit.xml \
        -o junit_family=xunit2 \
        -o junit_suite_name="agentsociety2-py${PYTHON_VERSION}"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - packages/agentsociety2/junit.xml
    reports:
      junit: packages/agentsociety2/junit.xml
  variables:
    AGENTSOCIETY_LLM_API_KEY: $AGENTSOCIETY_LLM_API_KEY
    AGENTSOCIETY_LLM_API_BASE: $AGENTSOCIETY_LLM_API_BASE
    AGENTSOCIETY_LLM_MODEL: glm-5

# ---------------------------------------------------------------------------
# Docker: speculative build, promote only when every required gate is green
# ---------------------------------------------------------------------------
# Layer intent (matches Dockerfile comments):
#   rarely churn  → apt / uv.lock / global CLIs  (BuildKit + registry :v2 cache)
#   often churn   → agentsociety2 source / extension vsix
#
# Speculative gate: default runtime 3.12. GitLab cannot "wait for whichever
# matrix cell finishes first"; 3.12 is the project default and a stable proxy.
# Publish still needs the full matrix (or is skipped when pytest is absent).

.docker_build_script: &docker_build_script
  - export TIME=$(date +%s)
  - docker pull ${CI_REGISTRY_IMAGE}:v2 || true
  - |
    docker build \
      --cache-from ${CI_REGISTRY_IMAGE}:v2 \
      -t "${DOCKER_PIPELINE_IMAGE}" \
      -t "${CI_REGISTRY_IMAGE}:mr-${CI_MERGE_REQUEST_IID:-local}" \
      .
  - |
    if [[ "$CI_COMMIT_BRANCH" == "main" ]]; then
      echo "Pushing speculative pipeline tag (promote to :v2 only after all gates)"
      docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
      docker push "${DOCKER_PIPELINE_IMAGE}"
    else
      echo "MR pipeline — build validated locally; not pushing :v2"
    fi

.docker_publish_script: &docker_publish_script
  - export TIME=$(date +%s)
  - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  - docker pull "${DOCKER_PIPELINE_IMAGE}"
  - docker tag "${DOCKER_PIPELINE_IMAGE}" "${CI_REGISTRY_IMAGE}:v2-${CI_COMMIT_SHORT_SHA}-${TIME}"
  - docker tag "${DOCKER_PIPELINE_IMAGE}" "${CI_REGISTRY_IMAGE}:v2"
  - docker push "${CI_REGISTRY_IMAGE}:v2-${CI_COMMIT_SHORT_SHA}-${TIME}"
  - docker push "${CI_REGISTRY_IMAGE}:v2"

# AS2 / lockfile changed → wait until test 3.12 passes, then build.
docker-build:
  tags:
    - dind
  stage: build
  interruptible: true
  needs:
    - job: test
      parallel:
        matrix:
          - PYTHON_VERSION: "3.12"
    # When this MR/push also touches extension/, wait for its lint job if present.
    - job: lint-extension
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docker_python_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docker_python_changes
  script: *docker_build_script

# Extension changed (and no AS2/lockfile) → wait for extension lint/build, then image.
docker-build-extension:
  tags:
    - dind
  stage: build
  interruptible: true
  needs:
    - job: lint-extension
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docker_python_changes
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docker_python_changes
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - extension/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - extension/**/*
  script: *docker_build_script

# Dockerfile / metadata only (no pytest, no extension job).
docker-build-dockerfile:
  tags:
    - dind
  stage: build
  interruptible: true
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docker_python_changes
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docker_python_changes
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - extension/**/*
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - extension/**/*
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - .dockerignore
        - README.md
        - LICENSE
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - Dockerfile
        - .dockerignore
        - README.md
        - LICENSE
  script: *docker_build_script

# Main only: retag speculative image → :v2 after the full test matrix is green.
docker-publish:
  tags:
    - dind
  stage: release
  interruptible: false
  needs:
    - job: test
    - job: docker-build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docker_python_changes
  script: *docker_publish_script

docker-publish-extension:
  tags:
    - dind
  stage: release
  interruptible: false
  needs:
    - job: docker-build-extension
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docker_python_changes
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - extension/**/*
  script: *docker_publish_script

docker-publish-dockerfile:
  tags:
    - dind
  stage: release
  interruptible: false
  needs:
    - job: docker-build-dockerfile
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docker_python_changes
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - extension/**/*
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - Dockerfile
        - .dockerignore
        - README.md
        - LICENSE
  script: *docker_publish_script

mirror-to-github:
  stage: release
  image:
    name: alpine/git:v2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+/
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - |
      if [ -z "${GITHUB_DEPLOY_KEY}" ]; then
        echo "GITHUB_DEPLOY_KEY is not set; skipping GitHub mirror."
        exit 0
      fi
      DEPLOY_KEY_FILE=~/.ssh/github_deploy_key
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      if [ -f "${GITHUB_DEPLOY_KEY}" ]; then
        KEY_MATERIAL=$(cat "${GITHUB_DEPLOY_KEY}")
      else
        KEY_MATERIAL="${GITHUB_DEPLOY_KEY}"
      fi
      KEY_MATERIAL=$(printf '%s' "$KEY_MATERIAL" | tr -d '\r')
      case "$(printf '%s' "$KEY_MATERIAL" | head -n1)" in
        -----BEGIN*)
          printf '%s\n' "$KEY_MATERIAL" > "${DEPLOY_KEY_FILE}"
          ;;
        *)
          printf '%s' "$KEY_MATERIAL" | tr -d '\n \t' | base64 -d > "${DEPLOY_KEY_FILE}"
          ;;
      esac
      chmod 600 "${DEPLOY_KEY_FILE}"
      if ! ssh-keygen -y -f "${DEPLOY_KEY_FILE}" >/dev/null 2>&1; then
        echo "GITHUB_DEPLOY_KEY is invalid. Paste raw PEM/OpenSSH key, or base64 of the key file bytes."
        exit 1
      fi
      ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
      chmod 644 ~/.ssh/known_hosts
      export GIT_SSH_COMMAND="ssh -i ${DEPLOY_KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
      git remote add github "git@github.com:tsinghua-fib-lab/AgentSociety.git" \
        || git remote set-url github "git@github.com:tsinghua-fib-lab/AgentSociety.git"
      if [ -n "${CI_COMMIT_TAG}" ]; then
        git push github "${CI_COMMIT_TAG}"
      elif [ "${CI_COMMIT_BRANCH}" = "main" ]; then
        git push github HEAD:main
      fi

generate-changelog:
  stage: release
  image: rust:slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+/
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - cargo install git-cliff
  script:
    - |
      CHANGELOG_BODY=$(git-cliff --latest --strip header --config cliff.toml)
      echo "$CHANGELOG_BODY" > release_notes.md
      echo "=== Generated Release Notes ==="
      head -50 release_notes.md
  artifacts:
    paths:
      - release_notes.md
    expire_in: 7 days

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [generate-changelog]
  rules:
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+/
  script:
    - echo "Creating GitLab release for ${CI_COMMIT_TAG}"
  release:
    name: "AgentSociety2 ${CI_COMMIT_TAG}"
    description: "$(cat release_notes.md)"
    tag_name: "${CI_COMMIT_TAG}"
    ref: "${CI_COMMIT_SHA}"
