stages:
  - lint
  - test
  - build
  - release

# New commits on the same branch cancel older pipelines' interruptible jobs
# (lint / test / speculative docker build). Publish jobs stay non-interruptible.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        DOCKER_RELEASE_TAG: "v2-beta"
    - if: $CI_COMMIT_TAG

variables:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.6"
  UV_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  DEBIAN_FRONTEND: noninteractive
  MEM0_TELEMETRY: "False"
  ANONYMIZED_TELEMETRY: "False"
  DOCKER_BUILDKIT: "1"
  # Main publishes :v2; the develop workflow overrides this with :v2-beta.
  DOCKER_RELEASE_TAG: "v2"
  # Temporary image tag for speculative build → promote only after all gates pass.
  DOCKER_PIPELINE_IMAGE: "${CI_REGISTRY_IMAGE}:pipeline-${CI_PIPELINE_ID}"

# CI scope: AgentSociety2 + extension + frontend only.
# Legacy packages (agentsociety v1, community, benchmark) are excluded.

# ---------------------------------------------------------------------------
# Change sets
# ---------------------------------------------------------------------------
# python_changes: quality gates (lint/test). Includes .gitlab-ci.yml so CI edits
# are self-tested; that path alone does NOT rebuild the Docker image.
.python_changes: &python_changes
  - CHANGELOG.md
  - cliff.toml
  - scripts/ci/**/*
  - Makefile
  - .github/workflows/*.yml
  - packages/agentsociety2/agentsociety2/**/*
  - packages/agentsociety2/tests/**/*
  - packages/agentsociety2/examples/**/*
  - packages/agentsociety2/scripts/**/*
  - packages/agentsociety2/pyproject.toml
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

# Python bits of the image — speculative build waits for test 3.12.
# Image inputs overall (for humans; rules below are split to avoid double builds):
#   Dockerfile, .dockerignore, packages/agentsociety2/**, extension/**,
#   pyproject.toml, uv.lock, README.md, LICENSE
# frontend/ is intentionally absent — not installed into the runtime image.
.docker_python_changes: &docker_python_changes
  - packages/agentsociety2/agentsociety2/**/*
  - packages/agentsociety2/examples/**/*
  - packages/agentsociety2/pyproject.toml
  - pyproject.toml
  - uv.lock

.documentation_changes: &documentation_changes
  - scripts/ci/**/*
  - Makefile
  - .github/workflows/*.yml
  - packages/agentsociety2/docs/**/*
  - packages/agentsociety2/agentsociety2/**/*
  - packages/agentsociety2/examples/**/*
  - packages/agentsociety2/scripts/**/*
  - packages/agentsociety2/pyproject.toml
  - packages/agentsociety2/.readthedocs.yaml
  - packages/agentsociety2/README*.md
  - extension/resources/walkthrough/**/*
  - extension/README.md
  - extension/scripts/check-doc-assets.mjs
  - README*.md
  - READTHEDOCS.md
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

.codeql_changes: &codeql_changes
  - packages/agentsociety2/agentsociety2/**/*
  - extension/src/**/*
  - frontend/src/**/*
  - .github/codeql/**/*
  - .github/workflows/*.yml
  - scripts/ci/**/*
  - .gitlab-ci.yml

# ---------------------------------------------------------------------------
# Caches (layered by churn rate)
# ---------------------------------------------------------------------------
# Lockfiles change rarely → high hit rate across MR pushes and main.
# Cache downloads only, not .venv / node_modules.
# Separate UV caches by role/Python version; npm ci remains deterministic.
.uv_download_cache: &uv_download_cache
  key:
    prefix: "sdk-py${PYTHON_VERSION}"
    files:
      - uv.lock
  paths:
    - .cache/uv
  policy: pull-push

# Documentation uses its own cache so parallel SDK jobs keep their downloads.
.uv_docs_cache: &uv_docs_cache
  key:
    prefix: "docs-py3.12"
    files:
      - uv.lock
  paths:
    - .cache/uv
  policy: pull-push

.uv_build_cache: &uv_build_cache
  key:
    prefix: "build-py3.12"
    files:
      - uv.lock
  paths:
    - .cache/uv
  policy: pull-push

.npm_extension_cache: &npm_extension_cache
  key:
    files:
      - extension/package-lock.json
  paths:
    - .cache/npm
  policy: pull-push

.npm_frontend_cache: &npm_frontend_cache
  key:
    files:
      - frontend/package-lock.json
  paths:
    - .cache/npm
  policy: pull-push

# Debian bookworm images need Graphviz and Node.js from HTTPS mirrors.
.debian-ci:
  before_script:
    - &prepare_debian |
      for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
        if [ -f "$source_file" ]; then
          sed -i \
            -e 's|http://deb\.debian\.org/debian-security|https://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
            -e 's|https://deb\.debian\.org/debian-security|https://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
            -e 's|http://security\.debian\.org/debian-security|https://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
            -e 's|https://security\.debian\.org/debian-security|https://mirrors.tuna.tsinghua.edu.cn/debian-security|g' \
            -e 's|http://deb\.debian\.org/debian|https://mirrors.tuna.tsinghua.edu.cn/debian|g' \
            -e 's|https://deb\.debian\.org/debian|https://mirrors.tuna.tsinghua.edu.cn/debian|g' "$source_file"
        fi
      done
      printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' > /etc/apt/apt.conf.d/80agentsociety-ci

# ---------------------------------------------------------------------------
# Lint / test
# ---------------------------------------------------------------------------
release-check:
  stage: lint
  image: python:3.12-bookworm
  interruptible: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - make ci-release-check AS2_PYTHON=python

lint:
  stage: lint
  image: python:3.12
  interruptible: true
  cache:
    <<: *uv_download_cache
  rules:
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *python_changes
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes: *python_changes
  before_script:
    - pip install --disable-pip-version-check --index-url "$UV_INDEX_URL" "uv==$UV_VERSION"
    - cd packages/agentsociety2 && uv sync --frozen --package agentsociety2 --no-default-groups --extra dev
  script:
    - make -C ../.. ci-config
    - make -C ../.. ci-python-lint

lint-extension:
  stage: lint
  image: node:22.23.1-bookworm
  interruptible: true
  cache:
    <<: *npm_extension_cache
  rules:
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - extension/**/*
        - scripts/ci/**/*
        - Makefile
        - .github/workflows/extension-ci.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - extension/**/*
        - scripts/ci/**/*
        - Makefile
        - .github/workflows/extension-ci.yml
        - .gitlab-ci.yml
  before_script:
    - cd extension && npm ci --prefer-offline --no-audit --fund=false
  script:
    - make -C .. ci-extension
    # npmmirror does not implement the audit API; query the official registry only for audit.
    # Advisory failures (transitive deps) must not block the build.
    - npm audit --audit-level=high --registry=https://registry.npmjs.org || true

lint-frontend:
  stage: lint
  image: node:22.23.1-bookworm
  interruptible: true
  cache:
    <<: *npm_frontend_cache
  rules:
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*
        - scripts/ci/**/*
        - Makefile
        - .github/workflows/frontend-ci.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - frontend/**/*
        - scripts/ci/**/*
        - Makefile
        - .github/workflows/frontend-ci.yml
        - .gitlab-ci.yml
  before_script:
    - cd frontend && npm ci --prefer-offline --no-audit --fund=false
  script:
    - make -C .. ci-frontend
    # npmmirror does not implement the audit API; query the official registry only for audit.
    # Advisory failures (transitive deps) must not block the build.
    - npm audit --audit-level=high --registry=https://registry.npmjs.org || true

test:
  stage: test
  image: python:$PYTHON_VERSION
  interruptible: true
  needs: [lint]
  cache:
    <<: *uv_download_cache
  rules:
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *python_changes
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes: *python_changes
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  before_script:
    - pip install --disable-pip-version-check --index-url "$UV_INDEX_URL" "uv==$UV_VERSION"
    - cd packages/agentsociety2 && uv sync --frozen --package agentsociety2 --no-default-groups --extra dev
  script:
    - |
      make -C ../.. ci-python-test AS2_PYTEST_ARGS="-v --junitxml=junit.xml -o junit_family=xunit2 -o junit_suite_name=agentsociety2-py${PYTHON_VERSION}"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - packages/agentsociety2/junit.xml
    reports:
      junit: packages/agentsociety2/junit.xml
  variables:
    AGENTSOCIETY_LLM_API_KEY: test-key
    AGENTSOCIETY_LLM_API_BASE: https://api.openai.com/v1
    AGENTSOCIETY_LLM_MODEL: gpt-5.5

# ---------------------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------------------

documentation:
  stage: test
  image: python:3.12-bookworm
  interruptible: true
  needs: []
  timeout: 20m
  cache:
    <<: *uv_docs_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *documentation_changes
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes: *documentation_changes
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+\.[0-9]+\.[0-9]+$/
  before_script:
    - *prepare_debian
    - apt-get update && apt-get install -y --no-install-recommends graphviz nodejs
    - pip install --disable-pip-version-check --index-url "$UV_INDEX_URL" "uv==$UV_VERSION"
    - uv sync --frozen --package agentsociety2 --no-default-groups --extra docs
  script:
    - make ci-config ci-docs-build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - docs-preview/
      - docs-doctest/
    exclude:
      - docs-preview/**/.doctrees/**/*
      - docs-doctest/**/.doctrees/**/*

codeql:
  stage: test
  image: python:3.12-bookworm
  interruptible: true
  needs: []
  timeout: 20m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 17m
  cache:
    key:
      files:
        - scripts/ci/codeql-bundle.json
    paths:
      - .cache/codeql/downloads/
    when: always
  rules:
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *codeql_changes
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes: *codeql_changes
  before_script:
    - *prepare_debian
    - apt-get update && apt-get install -y --no-install-recommends nodejs
  script:
    - python scripts/ci/codeql.py --language all --download-total-timeout 300
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - codeql-results/

build-package:
  stage: build
  image: python:3.12
  interruptible: true
  needs: [lint]
  cache:
    <<: *uv_build_cache
  rules:
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *python_changes
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes: *python_changes
  before_script:
    - pip install --disable-pip-version-check --index-url "$UV_INDEX_URL" "uv==$UV_VERSION"
  script:
    - make ci-package
  artifacts:
    expire_in: 7 days
    paths:
      - packages/agentsociety2/dist/

# ---------------------------------------------------------------------------
# Docker: speculative build, promote only when every required gate is green
# ---------------------------------------------------------------------------
# Layer intent (matches Dockerfile comments):
#   rarely churn  → apt / uv.lock / global CLIs  (BuildKit + registry :v2 cache)
#   often churn   → agentsociety2 source / extension vsix
#
# Speculative gate: default runtime 3.12. GitLab cannot "wait for whichever
# matrix cell finishes first"; 3.12 is the project default and a stable proxy.
# Publish still needs the full matrix (or is skipped when pytest is absent).

.docker_build_script: &docker_build_script
  - export TIME=$(date +%s)
  - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  - docker pull ${CI_REGISTRY_IMAGE}:v2 || true
  - |
    docker build \
      --cache-from ${CI_REGISTRY_IMAGE}:v2 \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t "${DOCKER_PIPELINE_IMAGE}" \
      -t "${CI_REGISTRY_IMAGE}:mr-${CI_MERGE_REQUEST_IID:-local}" \
      .
  - |
    if [[ "$CI_COMMIT_BRANCH" == "main" || "$CI_COMMIT_BRANCH" == "develop" ]]; then
      echo "Pushing speculative pipeline tag (promote to :${DOCKER_RELEASE_TAG} only after all gates)"
      docker push "${DOCKER_PIPELINE_IMAGE}"
    else
      echo "MR pipeline — build validated locally; not publishing runtime images"
    fi

.docker_publish_script: &docker_publish_script
  - export TIME=$(date +%s)
  - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  - docker pull "${DOCKER_PIPELINE_IMAGE}"
  - docker tag "${DOCKER_PIPELINE_IMAGE}" "${CI_REGISTRY_IMAGE}:${DOCKER_RELEASE_TAG}-${CI_COMMIT_SHORT_SHA}-${TIME}"
  - docker tag "${DOCKER_PIPELINE_IMAGE}" "${CI_REGISTRY_IMAGE}:${DOCKER_RELEASE_TAG}"
  - docker push "${CI_REGISTRY_IMAGE}:${DOCKER_RELEASE_TAG}-${CI_COMMIT_SHORT_SHA}-${TIME}"
  - docker push "${CI_REGISTRY_IMAGE}:${DOCKER_RELEASE_TAG}"

# AS2 / lockfile changed → wait until test 3.12 passes, then build.
docker-build:
  tags:
    - dind
  stage: build
  interruptible: true
  needs:
    - job: test
      artifacts: false
      parallel:
        matrix:
          - PYTHON_VERSION: "3.12"
    # When this MR/push also touches extension/, wait for its lint job if present.
    - job: lint-extension
      artifacts: false
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docker_python_changes
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes: *docker_python_changes
  script: *docker_build_script

# Extension changed (and no AS2/lockfile) → wait for extension lint/build, then image.
docker-build-extension:
  tags:
    - dind
  stage: build
  interruptible: true
  needs:
    - job: lint-extension
      artifacts: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docker_python_changes
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes: *docker_python_changes
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - extension/**/*
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - extension/**/*
  script: *docker_build_script

# Dockerfile / metadata only (no pytest, no extension job).
docker-build-dockerfile:
  tags:
    - dind
  stage: build
  interruptible: true
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docker_python_changes
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes: *docker_python_changes
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - extension/**/*
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - extension/**/*
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - .dockerignore
        - README.md
        - LICENSE
        - packages/agentsociety2/README*.md
        - packages/agentsociety2/LICENSE
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - Dockerfile
        - .dockerignore
        - README.md
        - LICENSE
        - packages/agentsociety2/README*.md
        - packages/agentsociety2/LICENSE
  script: *docker_build_script

# Main → :v2, develop → :v2-beta, after the full test matrix is green.
docker-publish:
  tags:
    - dind
  stage: release
  interruptible: false
  resource_group: agentsociety2-runtime-image
  needs:
    - job: lint-frontend
      artifacts: false
      optional: true
    - job: codeql
      artifacts: false
      optional: true
    - job: build-package
      artifacts: false
      optional: true
    - job: test
      artifacts: false
    - job: docker-build
      artifacts: false
    - job: documentation
      artifacts: false
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes: *docker_python_changes
  script: *docker_publish_script

docker-publish-extension:
  tags:
    - dind
  stage: release
  interruptible: false
  resource_group: agentsociety2-runtime-image
  needs:
    - job: lint-frontend
      artifacts: false
      optional: true
    - job: test
      artifacts: false
      optional: true
    - job: codeql
      artifacts: false
      optional: true
    - job: build-package
      artifacts: false
      optional: true
    - job: docker-build-extension
      artifacts: false
    - job: documentation
      artifacts: false
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes: *docker_python_changes
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - extension/**/*
  script: *docker_publish_script

docker-publish-dockerfile:
  tags:
    - dind
  stage: release
  interruptible: false
  resource_group: agentsociety2-runtime-image
  needs:
    - job: lint-extension
      artifacts: false
      optional: true
    - job: lint-frontend
      artifacts: false
      optional: true
    - job: test
      artifacts: false
      optional: true
    - job: codeql
      artifacts: false
      optional: true
    - job: build-package
      artifacts: false
      optional: true
    - job: docker-build-dockerfile
      artifacts: false
    - job: documentation
      artifacts: false
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes: *docker_python_changes
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - extension/**/*
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - Dockerfile
        - .dockerignore
        - README.md
        - LICENSE
        - packages/agentsociety2/README*.md
        - packages/agentsociety2/LICENSE
  script: *docker_publish_script

mirror-to-github:
  stage: release
  dependencies: []
  image:
    name: alpine/git:v2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+\.[0-9]+\.[0-9]+$/
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - |
      if [ -z "${GITHUB_DEPLOY_KEY}" ]; then
        echo "GITHUB_DEPLOY_KEY is not set; skipping GitHub mirror."
        exit 0
      fi
      DEPLOY_KEY_FILE=~/.ssh/github_deploy_key
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      if [ -f "${GITHUB_DEPLOY_KEY}" ]; then
        KEY_MATERIAL=$(cat "${GITHUB_DEPLOY_KEY}")
      else
        KEY_MATERIAL="${GITHUB_DEPLOY_KEY}"
      fi
      KEY_MATERIAL=$(printf '%s' "$KEY_MATERIAL" | tr -d '\r')
      case "$(printf '%s' "$KEY_MATERIAL" | head -n1)" in
        -----BEGIN*)
          printf '%s\n' "$KEY_MATERIAL" > "${DEPLOY_KEY_FILE}"
          ;;
        *)
          printf '%s' "$KEY_MATERIAL" | tr -d '\n \t' | base64 -d > "${DEPLOY_KEY_FILE}"
          ;;
      esac
      chmod 600 "${DEPLOY_KEY_FILE}"
      if ! ssh-keygen -y -f "${DEPLOY_KEY_FILE}" >/dev/null 2>&1; then
        echo "GITHUB_DEPLOY_KEY is invalid. Paste raw PEM/OpenSSH key, or base64 of the key file bytes."
        exit 1
      fi
      ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
      chmod 644 ~/.ssh/known_hosts
      export GIT_SSH_COMMAND="ssh -i ${DEPLOY_KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
      git remote add github "git@github.com:tsinghua-fib-lab/AgentSociety.git" \
        || git remote set-url github "git@github.com:tsinghua-fib-lab/AgentSociety.git"
      if [ -n "${CI_COMMIT_TAG}" ]; then
        git push github "${CI_COMMIT_TAG}"
      elif [ "${CI_COMMIT_BRANCH}" = "main" ]; then
        git push github HEAD:main
      fi

generate-changelog:
  stage: release
  dependencies: []
  image: python:3.12-bookworm
  rules:
    - if: $CI_COMMIT_TAG =~ /^agentsociety2-v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - python scripts/ci/release.py notes --release --output release_notes.md
  artifacts:
    paths:
      - release_notes.md
    expire_in: 7 days

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: release-check
      artifacts: false
    - job: lint
      artifacts: false
    - job: lint-extension
      artifacts: false
