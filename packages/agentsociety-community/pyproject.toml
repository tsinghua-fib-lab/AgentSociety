[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsociety-community"
version = "0.3.3"
description = "A community library for customizing agent/block for AgentSociety"
authors = [
    { name = "Jun Zhang", email = "zhangjun990222@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
requires-python = ">=3.11"
dependencies = [
    "agentsociety>=1.5.7,<2",
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
override-dependencies = [
    "urllib3>=2.8.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.27",
    "protobuf>=4.25.8",
    "starlette>=0.49.1",
    "aiohttp>=3.14.5",
    "certifi>=2026.10.19",
    "fsspec>=2026.9.0",
    "pyasn1>=0.6.4",
    "ray[default]>=2.58.0",
    "requests>=2.32.5",
    "grpcio>=1.71.0,<2",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.0",
    "h2>=4.4.1",
    "json-repair>=0.63.0",
    "setuptools>=83",
    "virtualenv>=21.14.12",
    "yarl>=1.25.1,<2",
]

[project.urls]
Homepage = "https://github.com/tsinghua-fib-lab/agentsociety-community"
Repository = "https://github.com/tsinghua-fib-lab/agentsociety-community.git"
Issues = "https://github.com/tsinghua-fib-lab/agentsociety-community/issues"
