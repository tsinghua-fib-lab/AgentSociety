# Paths are relative to the repository root (monorepo).
# Compatibility entry used by the existing RTD project; keep both AS2 configs aligned.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz

python:
  install:
    - requirements: packages/agentsociety2/docs/requirements.txt
    - method: pip
      path: packages/agentsociety2
      extra_requirements:
        - docs

sphinx:
  configuration: packages/agentsociety2/docs/conf.py
  fail_on_warning: true
